[versions]
kotlin = "2.4.21"
idea-ext = "1.4.1"
nightconfig = "3.9.0"

junit = "6.1.3"

minecraft = { prefer = "1.20.1", strictly = "[1.20,1.20.1]" }

# https://projects.neoforged.net/neoforged/ModDevGradle
moddev-gradle = "2.0.141"

# https://fabricmc.net/develop
fabric-loom = "1.19-SNAPSHOT"

# https://parchmentmc.org/docs/getting-started
parchment-minecraft = "1.20.1"
parchment-mapping = "2023.09.03"

# https://maven.fabricmc.net/net/fabricmc/sponge-mixin/
sponge-mixin = "0.17.5+mixin.0.8.7"

[plugins]
idea-ext = { id = "org.jetbrains.gradle.plugin.idea-ext", version.ref = "idea-ext" }

moddev-gradle-legacy = { id = "net.neoforged.moddev.legacyforge", version.ref = "moddev-gradle" }
fabric-loom = { id = "net.fabricmc.fabric-loom-remap", version.ref = "fabric-loom" }
fabric-loom-companion = { id = "net.fabricmc.fabric-loom-companion", version.ref = "fabric-loom" }

[libraries]
kotlin-plugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }

nightconfig-toml = { group = "com.electronwill.night-config", name = "toml", version.ref = "nightconfig" }

#noinspection UnusedVersionCatalogEntry
junit-bom = { group = "org.junit", name = "junit-bom", version.ref = "junit" }
#noinspection UnusedVersionCatalogEntry
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter" }
#noinspection UnusedVersionCatalogEntry
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }

minecraft = { group = "com.mojang", name = "minecraft", version.ref = "minecraft" }
sponge-mixin = { group = "net.fabricmc", name = "sponge-mixin", version.ref = "sponge-mixin" }